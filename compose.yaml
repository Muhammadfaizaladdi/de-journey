name: ecommerce-data-stack

services:
  postgres:
    image: postgres:alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  adminer:
    image: adminer:standalone
    ports:
      - "${ADMINER_HOST_PORT}:8080"
    depends_on:
      - postgres

  etl:
    build:
      context: ./etl
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: warehouse
      DB_USER: postgres
      DB_PASSWORD: postgres
      INPUT_PATH: /app/data/customers.csv
    volumes:
      - ./data:/app/data:ro
      - ./output:/app/output
    depends_on:
      - postgres

volumes:
  postgres_data: